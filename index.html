<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheSun</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="wrapper">
      <nav>
        <div class="logo">
          <p class="textshadow">
            THE <br />
            SUN
          </p>
        </div>
        <img src="images/sun.svg" alt="Slika Sunca." class="sun dropshadow" />
        <ul>
          <li><a href="#" class="textshadow">Home</a></li>
          <li><a href="#" class="textshadow">About</a></li>
          <li><a href="#" class="textshadow">Contact</a></li>
        </ul>
      </nav>
      <section>
        <p class="textshadow">Animacije na Webu</p>
      </section>
      <img src="images/cloud.svg" alt="" class="cloud dropshadow" />
      <img src="images/cloud.svg" alt="" class="cloud dropshadow" />
      <img src="images/cloud.svg" alt="" class="cloud dropshadow" />
      <img src="images/cloud.svg" alt="" class="cloud dropshadow" />
      <img src="images/cloud.svg" alt="" class="cloud dropshadow" />
    </header>

    <section class="card-section">
      <h2>GSAP POJMOVI</h2>

      <div class="cards">
        <div class="card dropshadow"></div>
        <div class="card dropshadow"></div>
        <div class="card dropshadow"></div>
        <div class="card dropshadow"></div>
        <div class="card dropshadow"></div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/MotionPathPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Draggable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/GSDevTools.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/InertiaPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <!-- ScrollSmoother requires ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollToPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
